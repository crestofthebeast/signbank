name: Auslan Signbank

on:
  push:
    branches:
      - actions-sh-migration

permissions:
  contents: read

jobs:
  build:
    name: Build release
    runs-on: ubuntu-22.04
    environment:
      name: testvm
    outputs:
      artifact_name: ${{ steps.output.outputs.artifact_name }}
      artifact_filename: ${{ steps.output.outputs.artifact_filename }}

    steps:
      - uses: actions/checkout@v3
      - name: Set up Elixir
        uses: erlef/setup-beam@v1.20.3
        with:
          version-type: strict
          version-file: .tool-versions
      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - name: Install dependencies
        run: mix deps.get
      - name: Set release version
        run: |
          echo "VERSION=$(grep 'version:' mix.exs | cut -d '"' -f2)" >> $GITHUB_ENV
      - name: Release v${{ env.VERSION }}
        run: |
          mix compile
          mix assets.deploy
          mix release
        env:
          MIX_ENV: prod
      - name: Set job output
        id: output
        run: |
          echo "artifact_name=signbank-${{ env.VERSION }}" >> "$GITHUB_OUTPUT"
          echo "artifact_filename=signbank-${{ env.VERSION }}.tar.gz" >> "$GITHUB_OUTPUT"
      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signbank-${{ env.VERSION }}
          path: _build/prod/signbank-${{ env.VERSION }}.tar.gz

  deploy:
    name: Deploy release
    runs-on: ubuntu-latest
    environment:
      name: testvm
    needs: build
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Check out the repository to the runner # is there a way to deduplicate this?
        uses: actions/checkout@v6
      - name: Create and set up SSH key
        run: |
          mkdir -p ~/.ssh/
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.STAGING_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          echo "${{ secrets.STAGING_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Download a Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
      - name: Ensure script is executable
        run: chmod +x deploy.sh
      - name: Copy build artefact tar onto remote
        run: scp ${{ needs.build.outputs.artifact_name }} ${{vars.STAGING_REMOTE_USER}}@${{ vars.STAGING_REMOTE_HOST }}:~/
      - name: Untar, move, and run release
        run: cat deploy.sh | ssh ${{vars.STAGING_REMOTE_USER}}@${{ vars.STAGING_REMOTE_HOST }}
